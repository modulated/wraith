[package]
name = "wraith-lsp"
version = "0.1.0"
edition = "2024"
description = "Language Server Protocol implementation for the Wraith language"

[[bin]]
name = "wraith-lsp"
path = "src/main.rs"

[dependencies]
wraith = { path = "../.." }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
