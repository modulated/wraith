# Wraith Compiler Configuration

# Memory sections define where code and data can be placed
# Each section has a name, start address, and end address

[[sections]]
name = "CODE"
start = 0x8000
end = 0xBFFF
description = "User code (16KB)"

[[sections]]
name = "DATA"
start = 0xD000
end = 0xDFFF
description = "Constants and data (4KB). Ends below $E000 so it never collides with the memory-mapped I/O window; a `const … : addr` for a device register in $E000-$EFFF is left alone."

# $E000-$EFFF is the memory-mapped I/O window (UART, 6522 VIA, expansion). It is
# deliberately NOT a compiler-managed section: device registers are declared with
# `const NAME: addr = 0xE0xx`, and nothing else may be placed there. Keep DATA
# below it so constant data is never laid over a device.

[[sections]]
name = "STACK"
start = 0x0200
end = 0x02FF
description = "Compiler software stack (recursion frame save, operand spill)"

[[sections]]
name = "BSS"
start = 0x0400
end = 0x07FF
description = "User RAM for mutable globals (`static`): 1KB above the zero page, hardware stack and software-stack page"

# Default section for functions without explicit #[org] or #[section]
default_section = "CODE"
